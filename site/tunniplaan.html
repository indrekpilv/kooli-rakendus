<!doctype html>
<html lang="et">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#008c3a">
    <meta name="description" content="Rakvere Eragümnaasiumi tunniplaan.">
    <title>Tunniplaan | Rakvere Eragümnaasium</title>
    <link rel="icon" type="image/png" href="assets/house-mark.png">
    <link rel="stylesheet" href="style.css">
    <script defer src="tunniplaan.js?v=11"></script>
  </head>
  <body data-page="timetable">
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="Rakvere Eragümnaasium – avaleht">
          <img src="assets/house-mark.png" alt="Rakvere Eragümnaasiumi majamärk">
          <span class="brand-name">
            <strong>Rakvere</strong>
            <small>Eragümnaasium</small>
          </span>
        </a>
        <nav class="main-nav" aria-label="Põhinavigatsioon">
          <a href="index.html">Avaleht</a>
          <a href="menu.html">Nädalamenüü</a>
          <a class="active" href="tunniplaan.html">Tunniplaan</a>
        </nav>
      </header>

      <main>
        <section class="page-intro timetable-page-intro" aria-labelledby="timetable-title">
          <a class="back-link" href="index.html"><span aria-hidden="true">←</span> Tagasi avalehele</a>
          <p class="eyebrow">Õppetöö</p>
          <h1 id="timetable-title">Tunniplaan</h1>
          <p class="timetable-description">Vali klass, õpetaja või ruum ja vaata nädala tunniplaani.</p>
        </section>

        <section class="timetable-shell" aria-label="Tunniplaani otsing">
          <div class="timetable-controls">
            <div class="timetable-tabs" role="tablist" aria-label="Otsitava tüübi valik">
              <button class="timetable-tab is-active" type="button" role="tab" aria-selected="true" data-entity-type="class">Klassid</button>
              <button class="timetable-tab" type="button" role="tab" aria-selected="false" data-entity-type="teacher">Õpetajad</button>
              <button class="timetable-tab" type="button" role="tab" aria-selected="false" data-entity-type="room">Ruumid</button>
            </div>
            <div class="search-box">
              <label class="search-label" for="timetable-search">Otsi</label>
              <input id="timetable-search" type="search" placeholder="Otsi klassi…" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="search-results" aria-expanded="false">
              <div class="search-results" id="search-results" role="listbox" hidden></div>
            </div>
          </div>

          <div class="timetable-layout">
            <section class="detail-panel" id="timetable-detail" aria-live="polite">
              <div class="loading-state">Laen tunniplaani…</div>
            </section>
          </div>
        </section>
      </main>

      <footer class="footer">
        <div>
          <strong>Rakvere Eragümnaasium</strong>
          <span><a href="index.html">Tagasi avalehele</a></span>
        </div>
        <span class="footer-note">Tunniplaan</span>
      </footer>
    </div>
  </body>
</html>
